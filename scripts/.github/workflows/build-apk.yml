name: Build Android APK
# Builds an installable Android APK online. Run it from the "Actions" tab (Run workflow) or push a tag such as v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # the desktop Electron download is not needed for the Android app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run android:prep         # copies the web app into ./www
      - run: npx cap add android
      - run: node scripts/android-splash.js     # black splash screen with the Smart21 logo
      - run: npx -y @capacitor/assets generate --android
        continue-on-error: true     # custom icon is optional; the build continues with the default one
      - run: npx cap sync android
      - name: Build APK (longer download timeout + retries)
        working-directory: android
        run: |
          sed -i '/networkTimeout/d' gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew assembleDebug && exit 0
            echo "Attempt $i failed, retrying in 30 seconds..."; sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Smart21Network-apk
          path: android/app/build/outputs/apk/debug/*.apk
