name: Deploy website + AI to Cloudflare
# Deploys the Worker (website + Workers AI) using wrangler.jsonc. Needs 2 GitHub secrets:
#   CLOUDFLARE_API_TOKEN  and  CLOUDFLARE_ACCOUNT_ID   (see DEPLOY-CLOUDFLARE.md)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run web:prep          # copies the web app into ./www
      - name: Check Cloudflare secrets (shows only found / MISSING, never the value)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          if [ -n "$T" ]; then echo "CLOUDFLARE_API_TOKEN: found (${#T} characters)"; else echo "CLOUDFLARE_API_TOKEN: MISSING"; ok=0; fi
          if [ -n "$A" ]; then echo "CLOUDFLARE_ACCOUNT_ID: found (${#A} characters)"; else echo "CLOUDFLARE_ACCOUNT_ID: MISSING"; ok=0; fi
          if [ "$ok" = 0 ]; then echo "Add the missing secret in THIS repository: Settings > Secrets and variables > Actions > Secrets tab > Repository secrets."; exit 1; fi
      - name: Deploy
        run: npx --yes wrangler@4 deploy      # wrangler 4 reads wrangler.jsonc (the action's default wrangler 3.90 cannot)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
